<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Звезда Бесконечности — Кабинет таролога</title>

  <!-- Подключение Google Fonts: Montserrat (заголовки) и Open Sans (текст) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">



  <style>
    /* ==========================================================================
       ЦВЕТОВАЯ ПАЛИТРА И ПЕРЕМЕННЫЕ
       ========================================================================== */
    :root {
      --bg-main: #F7F1E6;        /* Молочный — основной фон сайта */
      --brand-primary: #6B4E8E;  /* Аметистовый — шапка, заголовки, важные кнопки */
      --bg-dark: #2E2560;        /* Полночный индиго — подвал, акцентные блоки */
      --accent-lilac: #B79FD1;   /* Лиловый — карточки, hover */
      --text-main: #3B2417;      /* Тёмный шоколад — основной текст */
      --border-oak: #A97C50;     /* Дуб — разделители, рамки */
      --border-silver: #C9C4B8;  /* Лунное серебро — разделители, мягкие рамки */
      --btn-copy: #A0522D;       /* Корица — акцентная кнопка (копировать) */
      --stop-red: #C62828;       /* Красный — кнопка разгрузки (исходное состояние) */
      --stop-green: #2E7D32;     /* Зелёный — кнопка разгрузки (режим отдыха) */
      --white: #FFFFFF;
      --shadow-soft: 0 4px 14px rgba(46, 37, 96, 0.08);
      --radius-md: 14px;
      --radius-sm: 8px;
      --transition: 0.25s ease;
    }

    /* ==========================================================================
       БАЗОВЫЕ СТИЛИ (MOBILE-FIRST)
       ========================================================================== */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
    }

    body {
      font-family: 'Open Sans', sans-serif;
      background-color: var(--bg-main);
      color: var(--text-main);
      line-height: 1.55;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    h1, h2, h3, h4, button, .tile-title {
      font-family: 'Montserrat', sans-serif;
    }

    /* Контейнер страницы (отступ сверху под фиксированные элементы управления) */
    .app-container {
      width: 100%;
      max-width: 1080px;
      margin: 0 auto;
      padding: 72px 16px 32px;
      flex: 1 0 auto;
    }

    /* ==========================================================================
       ФИКСИРОВАННАЯ ПАНЕЛЬ: СТОП-КНОПКА (СЛЕВА) И НАСТРОЕНИЕ + ДОМИК (СПРАВА)
       ========================================================================== */

    /* 1. Прямоугольная кнопка «Стоп / Энергетическая разгрузка» в левом верхнем углу */
    .stop-unload-btn {
      position: fixed;
      top: 12px;
      left: 12px;
      z-index: 1000;
      padding: 8px 11px;
      border-radius: var(--radius-sm);
      border: 2px solid rgba(255, 255, 255, 0.45);
      background-color: var(--stop-red);
      color: var(--white);
      font-family: 'Montserrat', sans-serif;
      font-size: 0.74rem;
      font-weight: 700;
      line-height: 1.2;
      cursor: pointer;
      box-shadow: var(--shadow-soft);
      transition: background-color var(--transition), transform var(--transition);
    }

    .stop-unload-btn:hover {
      transform: translateY(-1px);
    }

    .stop-unload-btn:active {
      transform: scale(0.97);
    }

    .stop-unload-btn.rest-mode {
      background-color: var(--stop-green);
    }

    /* 2. Правый верхний угол: Виджет настроения + Иконка домика */
    .top-right-controls {
      position: fixed;
      top: 10px;
      right: 12px;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 8px;
    }

    .top-right-row {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* Контейнер кнопок настроения */
    .mood-widget {
      display: flex;
      align-items: center;
      gap: 4px;
      background-color: rgba(255, 255, 255, 0.92);
      border: 1.5px solid var(--border-oak);
      border-radius: 999px;
      padding: 3px 6px;
      box-shadow: var(--shadow-soft);
    }

    .mood-btn {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      border: 2px solid transparent;
      background: transparent;
      font-size: 16px;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform var(--transition), border-color var(--transition), background-color var(--transition);
    }

    .mood-btn:hover {
      transform: scale(1.12);
      background-color: var(--bg-main);
    }

    .mood-btn.active {
      border-color: var(--brand-primary);
      background-color: var(--accent-lilac);
    }

    /* Карточка с теплой фразой под смайликами */
    .mood-phrase-box {
      display: none;
      width: min(290px, calc(100vw - 24px));
      background-color: var(--white);
      border: 2px solid var(--brand-primary);
      border-radius: var(--radius-md);
      padding: 10px 30px 10px 12px;
      font-size: 0.84rem;
      line-height: 1.45;
      color: var(--text-main);
      box-shadow: 0 8px 22px rgba(46, 37, 96, 0.16);
      position: relative;
      animation: fadeIn 0.25s ease;
    }

    .mood-phrase-box.visible {
      display: block;
    }

    .mood-phrase-close {
      position: absolute;
      top: 6px;
      right: 8px;
      background: transparent;
      border: none;
      color: var(--brand-primary);
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      line-height: 1;
      padding: 2px 4px;
    }

    /* Кнопка-домик в правом верхнем углу на ВСЕХ экранах */
    .home-icon-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 2px solid var(--border-oak);
      background-color: var(--brand-primary);
      color: var(--white);
      font-size: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: var(--shadow-soft);
      transition: transform var(--transition), background-color var(--transition);
      flex-shrink: 0;
    }

    .home-icon-btn:hover,
    .home-icon-btn:focus-visible {
      background-color: var(--bg-dark);
      transform: scale(1.06);
      outline: none;
    }

    /* ==========================================================================
       ЛОГИКА ПЕРЕКЛЮЧЕНИЯ ЭКРАНОВ (SPA)
       ========================================================================== */
    .screen {
      display: none;
      animation: fadeIn 0.25s ease;
    }

    .screen.active {
      display: block;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Общие заголовки экранов */
    .page-title {
      color: var(--brand-primary);
      text-align: center;
      font-size: 1.45rem;
      font-weight: 700;
      margin-bottom: 20px;
      line-height: 1.3;
    }

    /* ==========================================================================
       ЭКРАН 1: ГЛАВНАЯ СТРАНИЦА (screen-home)
       ========================================================================== */
    .home-meta-bar {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 26px;
      padding: 14px 16px;
      background-color: rgba(255, 255, 255, 0.55);
      border: 1px solid var(--border-silver);
      border-top: 3px solid var(--border-oak);
      border-radius: var(--radius-md);
    }

    .lunar-date {
      font-family: 'Montserrat', sans-serif;
      font-weight: 600;
      font-size: 0.95rem;
      color: var(--brand-primary);
      white-space: nowrap;
    }

    .daily-quote {
      font-size: 0.92rem;
      font-style: italic;
      color: var(--text-main);
      border-left: 3px solid var(--accent-lilac);
      padding-left: 12px;
    }

    /* Сетка квадратных плиток (центруется аккуратно для 5 плиток) */
    .tiles-grid {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 14px;
      max-width: 720px;
      margin: 0 auto;
    }

    .tile-card {
      width: calc(50% - 7px);
      aspect-ratio: 1 / 1;
      background-color: var(--bg-main);
      border: 2px solid var(--border-oak);
      border-radius: var(--radius-md);
      padding: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      text-decoration: none;
      color: var(--text-main);
      cursor: pointer;
      box-shadow: var(--shadow-soft);
      transition: background-color var(--transition), transform var(--transition), border-color var(--transition);
    }

    .tile-card:hover,
    .tile-card:focus-visible {
      background-color: var(--accent-lilac);
      border-color: var(--brand-primary);
      transform: translateY(-3px);
      outline: none;
    }

    .tile-emoji {
      font-size: 2rem;
      margin-bottom: 10px;
      line-height: 1;
    }

    .tile-title {
      font-size: 0.88rem;
      font-weight: 700;
      color: var(--text-main);
      line-height: 1.3;
    }

    /* ==========================================================================
       ЭКРАН 2: ВЫБОР КОЛОДЫ ПОД ЗАПРОС (screen-decks)
       ========================================================================== */
    .decks-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
    }

    .deck-card {
      background-color: var(--white);
      border: 2px solid var(--border-oak);
      border-radius: var(--radius-md);
      padding: 20px;
      cursor: pointer;
      text-align: left;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 12px;
      box-shadow: var(--shadow-soft);
      transition: background-color var(--transition), transform var(--transition), border-color var(--transition);
    }

    .deck-card:hover,
    .deck-card:focus-visible {
      background-color: var(--accent-lilac);
      border-color: var(--brand-primary);
      transform: translateY(-2px);
      outline: none;
    }

    .deck-card-title {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--brand-primary);
      margin-bottom: 6px;
    }

    .deck-card:hover .deck-card-title {
      color: var(--bg-dark);
    }

    .deck-card-spec {
      font-size: 0.92rem;
      color: var(--text-main);
    }

    .deck-card-action {
      font-family: 'Montserrat', sans-serif;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--btn-copy);
      align-self: flex-end;
    }

    /* Внутренний вид выбранной колоды */
    .deck-detail-view {
      display: none;
    }

    .deck-detail-view.active {
      display: block;
      animation: fadeIn 0.25s ease;
    }

    .btn-back {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background-color: var(--brand-primary);
      color: var(--white);
      border: none;
      border-radius: var(--radius-sm);
      padding: 10px 16px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 18px;
      transition: background-color var(--transition);
    }

    .btn-back:hover {
      background-color: var(--bg-dark);
    }

    .deck-detail-header {
      background-color: var(--bg-dark);
      color: var(--white);
      padding: 18px 20px;
      border-radius: var(--radius-md);
      border-bottom: 4px solid var(--border-oak);
      margin-bottom: 20px;
    }

    .deck-detail-header h3 {
      font-size: 1.3rem;
      margin-bottom: 6px;
      color: var(--bg-main);
    }

    .deck-detail-header p {
      font-size: 0.95rem;
      color: var(--border-silver);
    }

    .category-block {
      background-color: var(--white);
      border: 1px solid var(--border-silver);
      border-left: 4px solid var(--brand-primary);
      border-radius: var(--radius-md);
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: var(--shadow-soft);
    }

    .category-heading {
      font-size: 1.02rem;
      font-weight: 700;
      color: var(--brand-primary);
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border-silver);
    }

    .question-item {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 10px 0;
      border-bottom: 1px dashed var(--border-silver);
    }

    .question-item:last-child {
      border-bottom: none;
      padding-bottom: 0;
    }

    .question-text {
      font-size: 0.95rem;
      color: var(--text-main);
    }

    /* Блок универсального промпта */
    .prompt-block {
      background-color: var(--white);
      border: 2px solid var(--border-oak);
      border-radius: var(--radius-md);
      padding: 18px;
      margin-top: 22px;
      box-shadow: var(--shadow-soft);
    }

    .prompt-header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 14px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border-silver);
    }

    .prompt-title {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--bg-dark);
    }

    .prompt-body {
      font-size: 0.9rem;
      white-space: pre-wrap;
      background-color: var(--bg-main);
      border: 1px solid var(--border-silver);
      border-radius: var(--radius-sm);
      padding: 14px;
      color: var(--text-main);
      line-height: 1.55;
    }

    /* ==========================================================================
       ЭКРАН 3: ОТВЕТЫ ШАБЛОНЫ (screen-templates) И ЭКРАН 4: ФОРМУЛИРОВКА ВОПРОСА
       ========================================================================== */
    .template-section {
      margin-bottom: 26px;
    }

    .template-section-title {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--white);
      background-color: var(--brand-primary);
      padding: 12px 16px;
      border-radius: var(--radius-sm);
      margin-bottom: 14px;
    }

    .template-variants {
      display: grid;
      grid-template-columns: 1fr;
      gap: 14px;
    }

    .template-card {
      background-color: var(--white);
      border: 1px solid var(--border-oak);
      border-radius: var(--radius-md);
      padding: 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 12px;
      box-shadow: var(--shadow-soft);
    }

    .template-variant-label {
      font-family: 'Montserrat', sans-serif;
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--brand-primary);
    }

    .template-text {
      font-size: 0.94rem;
      color: var(--text-main);
      background-color: var(--bg-main);
      padding: 12px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-silver);
    }

    /* Стили для карточек конструктора «Формулировка вопроса Картам» */
    .question-helper-card {
      background-color: var(--white);
      border: 1px solid var(--border-oak);
      border-radius: var(--radius-md);
      padding: 18px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 12px;
      box-shadow: var(--shadow-soft);
    }

    .question-helper-label {
      display: block;
      font-family: 'Montserrat', sans-serif;
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--text-main);
      margin-bottom: 6px;
    }

    .question-helper-textarea {
      width: 100%;
      min-height: 110px;
      padding: 12px;
      font-family: 'Open Sans', sans-serif;
      font-size: 0.94rem;
      color: var(--text-main);
      background-color: var(--bg-main);
      border: 1.5px solid var(--border-silver);
      border-radius: var(--radius-sm);
      resize: vertical;
      transition: border-color var(--transition), box-shadow var(--transition);
    }

    .question-helper-textarea:focus {
      outline: none;
      border-color: var(--brand-primary);
      box-shadow: 0 0 0 3px rgba(107, 78, 142, 0.15);
    }

        /* Новый блок для всегда видимого промпта со скроллом */
    .prompt-preview-box {
      margin-top: 8px;
      white-space: pre-wrap;
      font-size: 0.83rem;
      background-color: var(--bg-main);
      border: 1px solid var(--border-silver);
      border-radius: var(--radius-sm);
      padding: 10px;
      line-height: 1.48;
      max-height: 160px;
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: var(--border-oak) transparent;
    }

    .prompt-preview-box::-webkit-scrollbar {
      width: 6px;
    }
    .prompt-preview-box::-webkit-scrollbar-thumb {
      background-color: var(--border-oak);
      border-radius: 3px;
    }

    /* ==========================================================================
       КНОПКА «СКОПИРОВАТЬ»
       ========================================================================== */
    .btn-copy {
      align-self: flex-start;
      background-color: var(--btn-copy);
      color: var(--white);
      border: none;
      border-radius: var(--radius-sm);
      padding: 9px 15px;
      font-size: 0.86rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color var(--transition), transform var(--transition);
      white-space: nowrap;
    }

    .btn-copy:hover {
      background-color: var(--bg-dark);
    }

    .btn-copy:active {
      transform: scale(0.97);
    }

    .btn-copy.copied {
      background-color: var(--brand-primary);
    }

    /* ==========================================================================
       ПОДВАЛ С КНОПКОЙ «ГЛАВНАЯ» ВНИЗУ СЛЕВА
       ========================================================================== */
    .app-footer {
      flex-shrink: 0;
      background-color: var(--bg-dark);
      color: var(--bg-main);
      border-top: 3px solid var(--border-oak);
      padding: 14px 16px;
    }

    .footer-inner {
      max-width: 1080px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .btn-footer-home {
      background-color: var(--brand-primary);
      color: var(--white);
      border: 1px solid var(--accent-lilac);
      border-radius: var(--radius-sm);
      padding: 9px 18px;
      font-size: 0.92rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color var(--transition);
    }

    .btn-footer-home:hover {
      background-color: var(--accent-lilac);
      color: var(--text-main);
    }

    .footer-note {
      font-size: 0.82rem;
      color: var(--border-silver);
      text-align: right;
    }

    /* ==========================================================================
       АДАПТИВНОСТЬ ДЛЯ ПЛАНШЕТОВ И ПК
       ========================================================================== */
    @media (min-width: 600px) {
      .app-container {
        padding: 74px 24px 40px;
      }

      .stop-unload-btn {
        padding: 10px 16px;
        font-size: 0.84rem;
      }

      .mood-btn {
        width: 34px;
        height: 34px;
        font-size: 18px;
      }

      .home-icon-btn {
        width: 44px;
        height: 44px;
        font-size: 20px;
      }

      .page-title {
        font-size: 1.85rem;
        margin-bottom: 24px;
      }

      .home-meta-bar {
        flex-direction: row;
        align-items: center;
        justify-content: space-between;
        gap: 24px;
      }

      .daily-quote {
        text-align: right;
        border-left: none;
        border-right: 3px solid var(--accent-lilac);
        padding-left: 0;
        padding-right: 14px;
        max-width: 65%;
      }

      .tiles-grid {
        gap: 20px;
      }

      .tile-card {
        width: calc(33.333% - 14px);
      }

      .tile-emoji {
        font-size: 2.5rem;
      }

      .tile-title {
        font-size: 1.02rem;
      }

      .decks-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .question-item {
        flex-direction: row;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
      }

      .question-item .btn-copy {
        align-self: center;
      }
    }

    @media (min-width: 900px) {
      .decks-grid {
        grid-template-columns: repeat(3, 1fr);
      }

      .template-variants {
        grid-template-columns: repeat(3, 1fr);
      }
    }
  </style>
</head>
<body>

  <!-- 1. Фиксированная кнопка «Стоп / Энергетическая разгрузка» в верхнем левом углу -->
  <button
    type="button"
    class="stop-unload-btn"
    id="stop-unload-btn"
    aria-pressed="false"
  >Стоп / Разгрузка</button>

  <!-- 2. Фиксированный блок справа: Виджет настроения + Иконка домика -->
  <div class="top-right-controls">
    <div class="top-right-row">
      <div class="mood-widget" role="group" aria-label="Виджет настроения">
        <button type="button" class="mood-btn" data-mood="green" title="Отлично" aria-label="Отлично">🟢</button>
        <button type="button" class="mood-btn" data-mood="yellow" title="Нормально" aria-label="Нормально">🟡</button>
        <button type="button" class="mood-btn" data-mood="red" title="Плохо" aria-label="Плохо">🔴</button>
      </div>

      <button
        type="button"
        class="home-icon-btn"
        id="global-home-btn"
        title="На главную"
        aria-label="Вернуться на главную страницу"

    /* ========================================================================
       ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ (ДАТА, ЦИТАТА, БУФЕР ОБМЕНА)
       ======================================================================== */

        function initCurrentDate() {
      const now = new Date();
      const day = String(now.getDate()).padStart(2, '0');
      const month = String(now.getMonth() + 1).padStart(2, '0');

      // 1. Задаем точку отсчета (известное новолуние): 6 января 2000 года, 18:14
      const knownNewMoon = new Date(Date.UTC(2000, 0, 6, 18, 14, 0));
      
      // 2. Считаем, сколько дней прошло с той даты
      const diffTime = now.getTime() - knownNewMoon.getTime();
      const diffDays = diffTime / (1000 * 60 * 60 * 24);
      
      // 3. Длина лунного цикла (синодический месяц) — 29.530588853 дней
      const synodicMonth = 29.530588853;
      
      // 4. Вычисляем текущий лунный день (от 1 до 30)
      // Берем остаток от деления и округляем
      let lunarDay = Math.floor((diffDays % synodicMonth)) + 1;

      // Защита от ошибок округления
      if (lunarDay > 30) lunarDay = 30;
      if (lunarDay < 1) lunarDay = 1;

      // Выводим на экран
           document.getElementById('lunar-date').textContent = 
        `${day}.${month} - ${lunarDay} Лунный день`;
    }
  

    function initRandomQuote() {
      const randomIndex = Math.floor(Math.random() * QUOTES.length);
      document.getElementById('daily-quote').textContent = `«${QUOTES[randomIndex]}»`;
    }

    // Универсальное копирование текста в буфер обмена
    async function copyToClipboard(text, buttonElement) {
      let copied = false;

      if (navigator.clipboard && window.isSecureContext) {
        try {
          await navigator.clipboard.writeText(text);
          copied = true;
        } catch (err) {
          copied = false;
        }
      }

      if (!copied) {
        try {
          const textarea = document.createElement('textarea');
          textarea.value = text;
          textarea.style.position = 'fixed';
          textarea.style.left = '-9999px';
          textarea.style.top = '0';
          document.body.appendChild(textarea);
          textarea.focus();
          textarea.select();
          copied = document.execCommand('copy');
          document.body.removeChild(textarea);
        } catch (err) {
          copied = false;
        }
      }

      if (copied) {
        const originalText = "Скопировать 📋";
        buttonElement.textContent = "Скопировано!";
        buttonElement.classList.add('copied');

        clearTimeout(buttonElement._copyTimer);
        buttonElement._copyTimer = setTimeout(() => {
          buttonElement.textContent = originalText;
          buttonElement.classList.remove('copied');
        }, 2000);
      }
    }

    function createCopyButton(getTextFn) {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'btn-copy';
      btn.textContent = 'Скопировать 📋';
      btn.addEventListener('click', () => {
        const text = typeof getTextFn === 'function' ? getTextFn() : getTextFn;
        copyToClipboard(text, btn);
      });
      return btn;
    }

    /* ========================================================================
       1. КНОПКА «СТОП / ЭНЕРГЕТИЧЕСКАЯ РАЗГРУЗКА»
       ======================================================================== */
    function initStopUnloadButton() {
      const stopBtn = document.getElementById('stop-unload-btn');
      let isRestMode = false;

      stopBtn.addEventListener('click', () => {
        isRestMode = !isRestMode;
        stopBtn.classList.toggle('rest-mode', isRestMode);
        stopBtn.setAttribute('aria-pressed', String(isRestMode));

        // При переходе в режим отдыха открываем случайное видео в новой вкладке
        if (isRestMode) {
          const randomVideo = RELAX_VIDEOS[Math.floor(Math.random() * RELAX_VIDEOS.length)];
          window.open(randomVideo, '_blank', 'noopener,noreferrer');
        }
      });
    }

    /* ========================================================================
       2. ВИДЖЕТ НАСТРОЕНИЯ (С LOCALSTORAGE)
       ======================================================================== */
    function initMoodWidget() {
      const STORAGE_GROUP_KEY = 'tarot_mood_group';
      const STORAGE_INDEX_KEY = 'tarot_mood_last_index';

      const moodButtons = document.querySelectorAll('.mood-btn');
      const phraseBox = document.getElementById('mood-phrase-box');
      const phraseText = document.getElementById('mood-phrase-text');
      const closeBtn = document.getElementById('mood-phrase-close');

      function safeGetStorage(key) {
        try {
          return localStorage.getItem(key);
        } catch (e) {
          return null;
        }
      }

      function safeSetStorage(key, value) {
        try {
          localStorage.setItem(key, value);
        } catch (e) {
          // Игнорируем ограничения хранения
        }
      }

      // Выбирает случайный индекс фразы, отличный от предыдущего
      function pickDifferentIndex(group, excludeIndex) {
        const list = MOOD_PHRASES[group];
        const availableIndices = [];
        for (let i = 0; i < list.length; i++) {
          if (i !== excludeIndex) {
            availableIndices.push(i);
          }
        }
        return availableIndices[Math.floor(Math.random() * availableIndices.length)];
      }

      function showMoodPhrase(group, forceDifferentFromSameGroup) {
        if (!MOOD_PHRASES[group]) return;

        const savedGroup = safeGetStorage(STORAGE_GROUP_KEY);
        const savedIndexRaw = safeGetStorage(STORAGE_INDEX_KEY);
        const savedIndex = savedIndexRaw !== null ? parseInt(savedIndexRaw, 10) : null;

        const excludeIdx = (savedGroup === group || forceDifferentFromSameGroup) && !Number.isNaN(savedIndex)
          ? savedIndex
          : null;

        const nextIdx = pickDifferentIndex(group, excludeIdx);
        const phrase = MOOD_PHRASES[group][nextIdx];

        safeSetStorage(STORAGE_GROUP_KEY, group);
        safeSetStorage(STORAGE_INDEX_KEY, String(nextIdx));

        moodButtons.forEach((btn) => {
          btn.classList.toggle('active', btn.dataset.mood === group);
        });

        phraseText.textContent = phrase;
        phraseBox.classList.add('visible');
      }

      // Обработчики клика на смайлики
      moodButtons.forEach((btn) => {
        btn.addEventListener('click', () => {
          showMoodPhrase(btn.dataset.mood, false);
        });
      });

      // Закрытие карточки с фразой
      closeBtn.addEventListener('click', () => {
        phraseBox.classList.remove('visible');
      });

      // При перезагрузке страницы подгружаем новую фразу из сохранённой группы
      const initialGroup = safeGetStorage(STORAGE_GROUP_KEY);
      if (initialGroup && MOOD_PHRASES[initialGroup]) {
        showMoodPhrase(initialGroup, true);
      }
    }

    /* ========================================================================
       НАВИГАЦИЯ МЕЖДУ ЭКРАНАМИ (SPA)
       ======================================================================== */
    const screens = {
      home: document.getElementById('screen-home'),
      decks: document.getElementById('screen-decks'),
      templates: document.getElementById('screen-templates'),
      questionHelper: document.getElementById('screen-question-helper')
    };

    const decksListView = document.getElementById('decks-list-view');
    const deckDetailView = document.getElementById('deck-detail-view');
    const deckDetailContent = document.getElementById('deck-detail-content');

    function showScreen(screenKey) {
      Object.values(screens).forEach((el) => el.classList.remove('active'));
      if (screens[screenKey]) {
        screens[screenKey].classList.add('active');
      }
      if (screenKey === 'decks') {
        showDecksList();
      }
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function showDecksList() {
      decksListView.style.display = 'grid';
      deckDetailView.classList.remove('active');
    }

        function openDeckDetail(deckId) {
      const deck = DECKS_DATA.find((d) => d.id === deckId);
      if (!deck) return;

      deckDetailContent.innerHTML = '';

      const header = document.createElement('div');
      header.className = 'deck-detail-header';
      const title = document.createElement('h3');
      title.textContent = deck.title;
      const spec = document.createElement('p');
      spec.textContent = `Специализация: ${deck.specialization}`;
      header.append(title, spec);
      deckDetailContent.appendChild(header);

      deck.categories.forEach((cat) => {
        const catBlock = document.createElement('div');
        catBlock.className = 'category-block';

        const catHeading = document.createElement('h4');
        catHeading.className = 'category-heading';
        catHeading.textContent = `${cat.name} — ${cat.spread}`;
        catBlock.appendChild(catHeading);

        cat.questions.forEach((qText, idx) => {
          const item = document.createElement('div');
          item.className = 'question-item';

          const span = document.createElement('span');
          span.className = 'question-text';
          span.textContent = `${idx + 1}. ${qText}`;

          const copyBtn = createCopyButton(qText);
          item.append(span, copyBtn);
          catBlock.appendChild(item);
        });

        deckDetailContent.appendChild(catBlock);
      });

      const promptBlock = document.createElement('div');
      promptBlock.className = 'prompt-block';

      const promptHeader = document.createElement('div');
      promptHeader.className = 'prompt-header';

      const promptTitle = document.createElement('h4');
      promptTitle.className = 'prompt-title';
      promptTitle.textContent = `[${deck.promptTitle}]`;
      promptHeader.appendChild(promptTitle);

      const inputWrap = document.createElement('div');
      inputWrap.style.marginBottom = '15px';
      inputWrap.style.display = 'flex';
      inputWrap.style.flexDirection = 'column';
      inputWrap.style.gap = '10px';

      const labelSpread = document.createElement('label');
      labelSpread.className = 'question-helper-label';
      labelSpread.textContent = 'Расклад (название):';
      
      const inputSpread = document.createElement('input');
      inputSpread.type = 'text';
      inputSpread.className = 'question-helper-textarea';
      inputSpread.style.minHeight = 'auto';
      inputSpread.style.height = '40px';
      inputSpread.placeholder = 'Например: Кельтский крест (10 карт)';

      const labelQuestion = document.createElement('label');
      labelQuestion.className = 'question-helper-label';
      labelQuestion.textContent = 'Вопрос клиента:';

      const inputQuestion = document.createElement('textarea');
      inputQuestion.className = 'question-helper-textarea';
      inputQuestion.style.minHeight = '60px';
      inputQuestion.placeholder = 'Введите вопрос...';

      const labelCards = document.createElement('label');
      labelCards.className = 'question-helper-label';
      labelCards.textContent = 'Выпавшие карты (и их позиции):';

      const inputCards = document.createElement('textarea');
      inputCards.className = 'question-helper-textarea';
      inputCards.style.minHeight = '60px';
      inputCards.placeholder = '1. Маг\n2. Жрица...';

      inputWrap.append(labelSpread, inputSpread, labelQuestion, inputQuestion, labelCards, inputCards);

      const getFinalPromptText = () => {
        let finalText = deck.promptText;
        const spreadVal = inputSpread.value.trim() || '(не указан)';
        const questionVal = inputQuestion.value.trim() || '(не указан)';
        const cardsVal = inputCards.value.trim() || '(не указаны)';

        finalText = finalText.replace(/Расклад:\s*/g, `Расклад: ${spreadVal}\n`);
        finalText = finalText.replace(/Вопрос клиента:\s*/g, `Вопрос клиента: ${questionVal}\n`);
        finalText = finalText.replace(/Выпавшие карты \(и их позиции\):\s*/g, `Выпавшие карты (и их позиции): ${cardsVal}\n`);
        return finalText;
      };

      const promptCopyBtn = createCopyButton(getFinalPromptText);
      promptCopyBtn.style.marginTop = '10px';
      promptHeader.appendChild(promptCopyBtn);

      const promptBody = document.createElement('details');
      promptBody.open = true;
      promptBody.className = 'prompt-details';
      promptBody.style.marginTop = '10px';
      
      const summary = document.createElement('summary');
      summary.textContent = 'Показать итоговый текст промпта (обновляется при вводе)';
      
      const previewBox = document.createElement('div');
      previewBox.className = 'prompt-preview-box';
      previewBox.textContent = getFinalPromptText(); 

      const updatePreview = () => {
        previewBox.textContent = getFinalPromptText();
      };

      inputSpread.addEventListener('input', updatePreview);
      inputQuestion.addEventListener('input', updatePreview);
      inputCards.addEventListener('input', updatePreview);
      
      promptBody.append(summary, previewBox);

      promptBlock.append(promptHeader, inputWrap, promptBody);
      deckDetailContent.appendChild(promptBlock);

      decksListView.style.display = 'none';
      deckDetailView.classList.add('active');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    /* ========================================================================
       ОТРИСОВКА КАРТОЧЕК КОЛОД, ШАБЛОНОВ И КОНСТРУКТОРА ВОПРОСОВ
       ======================================================================== */
    function renderDecksGrid() {
      decksListView.innerHTML = '';

      DECKS_DATA.forEach((deck) => {
        const card = document.createElement('button');
        card.type = 'button';
        card.className = 'deck-card';

        const top = document.createElement('div');
        const title = document.createElement('div');
        title.className = 'deck-card-title';
        title.textContent = deck.title;

        const spec = document.createElement('p');
        spec.className = 'deck-card-spec';
        spec.textContent = `Специализация: ${deck.specialization}`;
        top.append(title, spec);

        const action = document.createElement('span');
        action.className = 'deck-card-action';
        action.textContent = 'Открыть расклады →';

        card.append(top, action);
        card.addEventListener('click', () => openDeckDetail(deck.id));
        decksListView.appendChild(card);
      });
    }

    function renderTemplates() {
      const container = document.getElementById('templates-container');
      container.innerHTML = '';

      TEMPLATES_DATA.forEach((section) => {
        const secEl = document.createElement('div');
        secEl.className = 'template-section';

        const secTitle = document.createElement('h3');
        secTitle.className = 'template-section-title';
        secTitle.textContent = section.sectionTitle;
        secEl.appendChild(secTitle);

        const grid = document.createElement('div');
        grid.className = 'template-variants';

        section.variants.forEach((variant) => {
          const card = document.createElement('div');
          card.className = 'template-card';

          const label = document.createElement('div');
          label.className = 'template-variant-label';
          label.textContent = variant.label;

          const textEl = document.createElement('p');
          textEl.className = 'template-text';
          textEl.textContent = variant.text;

          const copyBtn = createCopyButton(variant.text);

          card.append(label, textEl, copyBtn);
          grid.appendChild(card);
        });

        secEl.appendChild(grid);
        container.appendChild(secEl);
      });
    }

    // 3. Отрисовка 3 столбиков экрана «Формулировка вопроса Картам»
    function renderQuestionHelper() {
      const container = document.getElementById('question-helper-container');
      container.innerHTML = '';

          QUESTION_HELPER_COLUMNS.forEach((col) => {
        const card = document.createElement('div');
        card.className = 'question-helper-card';

        const topWrap = document.createElement('div');

        const title = document.createElement('h3');
        title.className = 'template-variant-label';
        title.style.marginBottom = '10px';
        title.textContent = col.title;

        const label = document.createElement('label');
        label.className = 'question-helper-label';
        label.setAttribute('for', `qh-input-${col.id}`);
        label.textContent = 'Вопрос клиента:';

        const textarea = document.createElement('textarea');
        textarea.id = `qh-input-${col.id}`;
        textarea.className = 'question-helper-textarea';
        textarea.placeholder = col.placeholder;

        // Всегда видимый заголовок и блок с текстом промпта (со скроллом)
        const promptPreviewTitle = document.createElement('div');
        promptPreviewTitle.className = 'question-helper-label';
        promptPreviewTitle.style.marginTop = '12px';
        promptPreviewTitle.textContent = 'Готовый промпт:';

        const previewBox = document.createElement('div');
        previewBox.className = 'prompt-preview-box';
        
        // Функция обновления текста в окошке предпросмотра в реальном времени
        const updatePreview = () => {
          const text = textarea.value.trim();
          previewBox.textContent = text ? col.buildPrompt(text) : col.previewPrompt;
        };

        // Слушаем ввод текста (включая вставку из буфера обмена)
        textarea.addEventListener('input', updatePreview);
        textarea.addEventListener('paste', () => setTimeout(updatePreview, 10));

        // Запускаем 1 раз при создании карточки, чтобы заполнить текст
        updatePreview();

        topWrap.append(title, label, textarea, promptPreviewTitle, previewBox);

        // Кнопка копирует именно тот текст, который сейчас виден в окошке
        const copyBtn = createCopyButton(() => previewBox.textContent);

        card.append(topWrap, copyBtn);
        container.appendChild(card);
      });
    }

    /* ========================================================================
       ИНИЦИАЛИЗАЦИЯ ПРИ ЗАГРУЗКЕ СТРАНИЦЫ
       ======================================================================== */
    document.addEventListener('DOMContentLoaded', () => {
      initCurrentDate();
      initRandomQuote();
      initStopUnloadButton();
      initMoodWidget();
      renderDecksGrid();
      renderTemplates();
      renderQuestionHelper();

      // Обработчики навигации по плиткам
      document.getElementById('tile-decks').addEventListener('click', () => showScreen('decks'));
      document.getElementById('tile-templates').addEventListener('click', () => showScreen('templates'));
      document.getElementById('tile-question-helper').addEventListener('click', () => showScreen('questionHelper'));
      document.getElementById('btn-back-to-decks').addEventListener('click', showDecksList);

                 // Возврат на главную с иконки 🏠 и кнопки в подвале
      document.getElementById('global-home-btn').addEventListener('click', () => showScreen('home'));
      document.getElementById('footer-home-btn').addEventListener('click', () => showScreen('home'));
    }); // <-- ВОТ ЭТА СКОБКА И СКОБКА С ТОЧКОЙ С ЗАПЯТОЙ ЗАКРЫВАЮТ СОБЫТИЕ DOMContentLoaded
  </script>
